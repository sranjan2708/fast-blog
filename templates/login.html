{% extends "base.html" %}

{% block content %}

<h1>Login</h1>

<form method="post" action="/login">

    <div>
        <label for="email">Email</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >
    </div>

    <br>

    <div>
        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            required
        >
    </div>

    <br>

    <button type="submit">Login</button>

</form>

{% endblock %}
