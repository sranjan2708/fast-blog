{% extends "base.html" %}

{% block title %}
Login - Fast Blog
{% endblock %}

{% block content %}

<div class="form-container">

    <div class="card">

        <h1 class="page-title">
            Login
        </h1>

        <p class="page-subtitle">
            Sign in to your Fast Blog account.
        </p>


        {% if message %}

            <div class="message message-error">

                {{ message }}

            </div>

        {% endif %}


        <form
            method="POST"
            action="/login"
        >

            <!-- Email -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ email or '' }}"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- Submit -->

            <button
                type="submit"
                class="button"
            >
                Login
            </button>

        </form>


        <p>

            Don't have an account?

            <a href="/register">
                Create an account
            </a>

        </p>

    </div>

</div>

{% endblock %}
