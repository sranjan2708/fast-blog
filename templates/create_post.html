{% extends "base.html" %}

{% block content %}

<h1>Create New Post</h1>

{% if message %}
    <p>{{ message }}</p>
{% endif %}

<form method="POST" action="/posts/create">

    <div>
        <label for="title">Title</label>
        <input
            type="text"
            id="title"
            name="title"
            maxlength="200"
            required
        >
    </div>

    <br>

    <div>
        <label for="content">Content</label>
        <textarea
            id="content"
            name="content"
            maxlength="5000"
            required
        ></textarea>
    </div>

    <br>

    <div>
        <label for="status">Status</label>

        <select id="status" name="status">
            <option value="draft">Draft</option>
            <option value="published">Published</option>
        </select>
    </div>

    <br>

    <button type="submit">
        Create Post
    </button>

</form>

{% endblock %}
