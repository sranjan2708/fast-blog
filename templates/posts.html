{% extends "base.html" %}

{% block content %}

<h1>All Posts</h1>

{% if posts %}

    {% for post in posts %}

        <article>

            <h2>
                <a href="/posts/{{ post.id }}">
                    {{ post.title }}
                </a>
            </h2>

            <p>
                By {{ post.user.username }}
            </p>

            <p>
                Status: {{ post.status }}
            </p>

            <p>
                Created: {{ post.created_at }}
            </p>

            <hr>

        </article>

    {% endfor %}

{% else %}

    <p>No posts available.</p>

{% endif %}

{% endblock %}
