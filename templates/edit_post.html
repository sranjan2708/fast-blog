{% extends "base.html" %}

{% block content %}

<h1>Edit Post</h1>

{% if message %}
    <p>{{ message }}</p>
{% endif %}

<form method="POST" action="/posts/{{ post.id }}/edit">

    <div>

        <label for="title">Title</label>

        <input
            type="text"
            id="title"
            name="title"
            value="{{ post.title }}"
            maxlength="200"
            required
        >

    </div>

    <br>

    <div>

        <label for="content">Content</label>

        <textarea
            id="content"
            name="content"
            maxlength="5000"
            required
        >{{ post.content }}</textarea>

    </div>

    <br>

    <div>

        <label for="status">Status</label>

        <select id="status" name="status">

            <option
                value="draft"
                {% if post.status == "draft" %}selected{% endif %}
            >
                Draft
            </option>

            <option
                value="published"
                {% if post.status == "published" %}selected{% endif %}
            >
                Published
            </option>

        </select>

    </div>

    <br>

    <div>

        <label for="categories">Categories</label>

        <select
            id="categories"
            name="category_ids"
            multiple
        >

            {% for category in categories %}

                <option
                    value="{{ category.id }}"
                    {% if category in post.categories %}selected{% endif %}
                >
                    {{ category.name }}
                </option>

            {% endfor %}

        </select>

    </div>

    <br>

    <div>

        <label for="tags">Tags</label>

        <select
            id="tags"
            name="tag_ids"
            multiple
        >

            {% for tag in tags %}

                <option
                    value="{{ tag.id }}"
                    {% if tag in post.tags %}selected{% endif %}
                >
                    {{ tag.name }}
                </option>

            {% endfor %}

        </select>

    </div>

    <br>

    <button type="submit">
        Update Post
    </button>

</form>

<br>

<a href="/posts/{{ post.slug }}">
    Cancel
</a>

{% endblock %}
